# GitHub Actions Workflow - CodeQL Code Scanning
# Analise estatica de seguranca para o repositorio genie-skills-eval.
#
# Linguagem detectada a partir do codigo do projeto: Python
#   - 19 arquivos .py (notebooks Databricks de ingestao, transformacao,
#     analise e validacao do pipeline ANEEL)
#   - Arquivos HTML (exportacoes de chat) nao sao analisados pelo CodeQL
#
# Triggers:
#   - push na branch main
#   - pull requests na branch main
#   - agendamento semanal (segunda-feira 01:30 UTC)

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Segunda-feira as 01:30 UTC
    - cron: "30 1 * * 1"

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Linguagem detectada no projeto
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # Autobuild tenta construir o projeto automaticamente.
      # Para projetos Python sem build step explicito, isso e suficiente.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
